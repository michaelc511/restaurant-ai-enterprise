# fly.toml app configuration file generated for restaurant-ai-platform on 2026-11-08T11:54:09-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'restaurant-ai-platform'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DAILY_BUDGET_USD = '1.00'
  DEFAULT_ENGINE = 'langgraph'
  RATE_LIMIT_PER_DAY = '50'
  RATE_LIMIT_PER_MINUTE = '5'

[[mounts]]
  source = 'rest_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/collections'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
